<div class="contenedor" *ngIf="producto() as p">
  <h1>Editar: {{ p.nombre }}</h1>

  <div class="tarjeta seccion">
    <h2>Datos generales</h2>
    <div class="campo">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="edicion.nombre" />
    </div>
    <div class="campo">
      <label>Descripción</label>
      <textarea [(ngModel)]="edicion.descripcion"></textarea>
    </div>
    <div class="campo">
      <label>Precio base (₡)</label>
      <input type="number" [(ngModel)]="edicion.precioBase" />
    </div>
    <button type="button" class="boton" (click)="guardarDatos()">Guardar cambios</button>

    <div class="campo stock">
      <label>Stock</label>
      <input type="number" [(ngModel)]="edicion.stock" />
      <button type="button" class="boton-secundario" (click)="actualizarStock()">Actualizar stock</button>
    </div>
  </div>

  <div class="tarjeta seccion">
    <h2>Características (Material, Color, Forma)</h2>
    <app-admin-producto-atributos [producto]="p" [productoId]="productoId" (actualizado)="cargarProducto()" />
  </div>

  <div class="tarjeta seccion">
    <h2>Imágenes del carrusel</h2>
    <app-admin-producto-imagenes [producto]="p" [productoId]="productoId" (actualizado)="cargarProducto()" />
  </div>

  <div class="tarjeta seccion">
    <h2>Diseños predeterminados de grabado</h2>
    <app-admin-producto-disenos [producto]="p" [productoId]="productoId" (actualizado)="cargarProducto()" />
  </div>
</div>
