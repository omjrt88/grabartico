@for (tipo of tiposAtributo; track tipo.id) {
  <div class="grupo-tipo">
    <h3>{{ tipo.nombre }}</h3>
    <div class="valores">
      @for (valor of tipo.valores; track valor.id) {
        <div class="valor-fila">
          <span>{{ valor.valor }}</span>
          @if (yaAsignado(valor.id)) {
            <span class="etiqueta-estado">Asignado</span>
          } @else {
            <input
              type="number"
              placeholder="Modificador ₡"
              [(ngModel)]="nuevoModificador[valor.id]"
              name="mod-{{ valor.id }}"
            />
            <button type="button" class="boton-secundario" (click)="asignar(valor.id)">Asignar a este producto</button>
          }
        </div>
      }
    </div>
    <div class="agregar-valor">
      <input type="text" placeholder="Nuevo valor" [(ngModel)]="nuevoValorPorTipo[tipo.id]" name="valor-{{ tipo.id }}" />
      <button type="button" class="boton-secundario" (click)="crearValor(tipo.id)">Agregar valor</button>
    </div>
  </div>
}

<div class="agregar-tipo">
  <input type="text" placeholder="Nuevo tipo de característica" [(ngModel)]="nuevoTipoNombre" />
  <button type="button" class="boton-secundario" (click)="crearTipo()">Agregar tipo</button>
</div>
